(function(){
  const bannerId = 'examIntegrityBanner';
  function banner(msg){
    let b = document.getElementById(bannerId);
    if(!b){
      b = document.createElement('div');
      b.id = bannerId;
      b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#7a0000;color:#fff;padding:10px 14px;font:600 14px Arial,sans-serif;text-align:center';
      document.body.appendChild(b);
    }
    b.textContent = msg;
  }
  async function fs(){
    try{
      if (!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }
    }catch(e){}
  }
  let armed = false;
  function arm(){
    if(armed) return;
    armed = true;
    fs();
    banner('Fullscreen required. Stay on this tab.');
  }
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('touchstart', arm, true);
  window.addEventListener('keydown', arm, true);
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) location.reload();
  });
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) location.reload();
  });
})();
</script>
