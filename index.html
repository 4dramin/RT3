(function(){
  const bannerId = 'examIntegrityBanner';
  function banner(msg){
    let b = document.getElementById(bannerId);
    if(!b){
      b = document.createElement('div');
      b.id = bannerId;
      b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#7a0000;color:#fff;padding:10px 14px;font:600 14px Arial,sans-serif;text-align:center';
      document.body.appendChild(b);
    }
    b.textContent = msg;
  }
  async function fs(){
    try{
      if (!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }
    }catch(e){}
  }
  let armed = false;
  function arm(){
    if(armed) return;
    armed = true;
    fs();
    banner('Fullscreen required. Stay on this tab.');
  }
  window.addEventListener('pointerdown', arm, true);
  window.addEventListener('touchstart', arm, true);
  window.addEventListener('keydown', arm, true);
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) location.reload();
  });
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) location.reload();
  });
})();

      +'max-width:480px;animation:_flp .35s ease-in-out infinite alternate;'
      +'border:2px solid rgba(255,80,80,.35);">'
      +'<div style="font-size:4.2rem;margin-bottom:10px">&#x1F6A8;</div>'
      +'<h2 style="color:#fff;font-size:1.8rem;margin-bottom:14px;font-weight:900">'
      +'&#x26A0;&#xFE0F; WARNING</h2>'
      +'<p style="color:#ffcdd2;font-size:1.06rem;line-height:1.75;margin-bottom:18px">'+msg+'</p>'
      +'<p style="color:rgba(255,255,255,.55);font-size:.78rem">This incident has been recorded.</p>'
      +'</div>';
    clearTimeout(_ot);
    _ot=setTimeout(function(){if(_ov)_ov.innerHTML='';},6000);
  }

  /* ── Background polling: LEGACY API ONLY — no browser permission dialog ── */
  setInterval(_w,2000);

  /* ── Focus-loss detection ────────────────────────────────────────────
     _engaged starts false. Only a real click/keydown/touch flips it.
     _back() does NOT set _engaged (was the bug: page-load window.focus event
     was marking the session as engaged before any user interaction).
     Threshold 800 ms: clicking a form field returns focus in <100 ms (no alarm).
     A real snipping-tool session keeps focus away for >1 s.
  ────────────────────────────────────────────────────────────────────────────────────────── */
  var _lb=0,_bt=null,_engaged=false;

  ['click','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev,function _e(){
      _engaged=true;
      document.removeEventListener(ev,_e,true);
    },true);
  });

  function _lost(){
    if(!_engaged)return;       /* ignore blur before ANY user interaction */
    _lb=Date.now();
    _wFull();                  /* safe: called from blur event handler */
    clearInterval(_bt);
    _bt=setInterval(_w,120);   /* legacy API only during polling */
  }

  function _back(){
    clearInterval(_bt);
    /* IMPORTANT: do NOT set _engaged=true here — page-load window.focus fires before
       user interaction and would falsely mark the session as engaged */
    if(!_engaged)return;       /* still not engaged — ignore */
    var duration=_lb?Date.now()-_lb:0;
    _lb=0;
    if(duration>800){
      setTimeout(function(){
        var ae=document.activeElement;
        var toInput=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'
                   ||ae.tagName==='SELECT'||ae.isContentEditable);
        if(!toInput){
          _warn('Screen capture is not allowed! The clipboard has been cleared.');
        }
      },60);
    }
  }

  window.addEventListener('blur',_lost);
  window.addEventListener('focus',_back);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)_lost();else _back();
  });

  /* ── PrintScreen keyup ── */
  document.addEventListener('keyup',function(e){
    if(e.key==='PrintScreen'||e.keyCode===44){
      _warn('Screenshots are strictly prohibited during this exam!');
    }
  },true);

})();
</script>
